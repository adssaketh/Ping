name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Train spam model (Indian SMS spam dataset)
        # Downloads junioralive/india-spam-sms-classification and trains the on-device model.
        # If this step fails the build still uses the model already committed in public/.
        continue-on-error: true
        run: node scripts/train-spam-model.mjs

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          elif [ ! -f "android/gradlew" ] || [ ! -f "android/settings.gradle" ] || [ ! -f "android/variables.gradle" ]; then
            # android/ is committed but missing Gradle scaffold files.
            # Generate a fresh scaffold, then copy in only the files that are
            # missing, so your own sources (manifest, Java, res) are kept.
            mv android android_custom
            npx cap add android
            rsync -a --ignore-existing android/ android_custom/
            rm -rf android
            mv android_custom android
          fi
          npx cap sync android

      - name: Remove duplicate launcher icon PNGs
        # mipmap-anydpi-v26 must only hold the adaptive-icon XML files. PNGs with the same
        # names there make Gradle fail with "Duplicate resources".
        run: rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ping-sms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
