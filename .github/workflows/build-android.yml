name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Train spam model (Indian SMS spam dataset)
        # Downloads junioralive/india-spam-sms-classification and trains the on-device model.
        # If this step fails the build still uses the model already committed in public/.
        continue-on-error: true
        run: node scripts/train-spam-model.mjs

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          elif [ ! -f "android/gradlew" ] || [ ! -f "android/settings.gradle" ] || [ ! -f "android/variables.gradle" ]; then
            # android/ is committed but missing Gradle scaffold files.
            # Generate a fresh scaffold, then copy in only the files that are
            # missing, so your own sources (manifest, Java, res) are kept.
            mv android android_custom
            npx cap add android
            rsync -a --ignore-existing android/ android_custom/
            rm -rf android
            mv android_custom android
          fi
          npx cap sync android

      - name: Remove duplicate launcher icon PNGs
        # mipmap-anydpi-v26 must only hold the adaptive-icon XML files. PNGs with the same
        # names there make Gradle fail with "Duplicate resources".
        run: rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png

      - name: Build Android APK
        id: build
        working-directory: android
        env:
          PING_KEYSTORE_BASE64: ${{ secrets.PING_KEYSTORE_BASE64 }}
          PING_KEYSTORE_PASSWORD: ${{ secrets.PING_KEYSTORE_PASSWORD }}
          PING_KEY_ALIAS: ${{ secrets.PING_KEY_ALIAS }}
          PING_KEY_PASSWORD: ${{ secrets.PING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$PING_KEYSTORE_BASE64" ]; then
            # Your signing key is set up: build a fast, signed release APK that can update the installed app
            echo "$PING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ping-release.jks"
            export PING_KEYSTORE_PATH="$RUNNER_TEMP/ping-release.jks"
            ./gradlew assembleRelease --no-daemon
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=ping-sms-signed-apk" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key found (see SIGNING.md): building a debug APK instead."
            ./gradlew assembleDebug --no-daemon
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=ping-sms-debug-apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
